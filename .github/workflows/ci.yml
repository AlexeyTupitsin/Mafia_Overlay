name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Тесты поднимают сервер сами, на свободных портах и во временных
      # каталогах — внешних сервисов и предварительного запуска не требуют.
      - run: npm test
